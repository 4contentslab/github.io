<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제미나이 캔버스 완전정복 4지선다 퀴즈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- 헤더 영역 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg">
          C
        </span>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">제미나이 캔버스 마스터 퀴즈</h1>
      </div>
      <div class="text-sm font-medium text-slate-500" id="progress-indicator">
        문제 1 / 5
      </div>
    </div>
  </header>

  <!-- 메인 퀴즈 컨테이너 -->
  <main class="max-w-2xl mx-auto px-4 py-8 flex-1 w-full">
    
    <!-- 프로그레스 바 -->
    <div class="w-full bg-slate-200 rounded-full h-2.5 mb-6 overflow-hidden">
      <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300 ease-out" style="width: 20%"></div>
    </div>

    <!-- 퀴즈 카드 -->
    <div id="quiz-card" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <!-- 질문 번호 및 카테고리 태그 -->
      <div class="flex items-center gap-2 mb-3">
        <span id="badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-600">
          핵심 인터페이스
        </span>
      </div>

      <!-- 문제 본문 -->
      <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-900 leading-snug mb-6">
        문제가 이곳에 표시됩니다.
      </h2>

      <!-- 보기 목록 -->
      <div id="options-container" class="space-y-3 mb-6">
        <!-- 동적으로 보기 버튼 생성 -->
      </div>

      <!-- 해설 박스 (답변 선택 후 표시) -->
      <div id="feedback-box" class="hidden rounded-xl p-4 mb-6 border transition-all duration-200">
        <div class="flex items-start gap-3">
          <i id="feedback-icon" class="text-lg mt-0.5"></i>
          <div>
            <h4 id="feedback-title" class="font-bold text-sm mb-1"></h4>
            <p id="feedback-desc" class="text-sm text-slate-600 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <!-- 다음 버튼 -->
      <button id="next-btn" class="hidden w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold rounded-xl transition duration-150 flex items-center justify-center gap-2 shadow-sm">
        <span>다음 문제로 넘어가기</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </div>

    <!-- 결과 화면 (마지막 문제 완료 후 표시) -->
    <div id="result-card" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
      <div class="w-20 h-20 mx-auto rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-3xl mb-4">
        <i class="fa-solid fa-award"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">퀴즈 완료!</h2>
      <p class="text-slate-500 mb-6" id="result-message">수고하셨습니다. 학습 결과를 확인해보세요.</p>
      
      <div class="bg-slate-50 rounded-xl p-6 border border-slate-100 mb-8 max-w-sm mx-auto">
        <div class="text-sm text-slate-500 mb-1">최종 점수</div>
        <div class="text-4xl font-extrabold text-blue-600" id="final-score">0 / 5</div>
        <div class="text-xs text-slate-400 mt-2" id="score-percent">정답률 0%</div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button id="retry-btn" class="py-3 px-6 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right text-sm"></i>
          <span>다시 도전하기</span>
        </button>
      </div>
    </div>

  </main>

  <!-- 푸터 -->
  <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white">
    제미나이 캔버스 가이드북 실전 학습용 웹페이지
  </footer>

  <script>
    const quizData = [
      {
        category: "기본 화면 구조",
        question: "구글 제미나이 캔버스의 실제 기본 화면 구성으로 가장 올바른 설명은 무엇일까요?",
        options: [
          "왼쪽에는 영구 타임라인 히스토리 창이 있고, 오른쪽에는 고정 퀴즈 변환 바가 있다.",
          "넓은 메인 문서 에디터 창과 하단의 토글형 플로팅 대화창으로 심플하게 구성되어 있다.",
          "화면 상단에 고정된 스마트 서식 툴바와 AI 문체 분석 패널이 항상 떠 있다.",
          "단독 창이 아닌 기존 채팅창 속에 작은 메모장 위젯 형태로만 제공된다."
        ],
        answer: 1,
        explanation: "제미나이 캔버스는 불필요한 고정 툴바 대신 넓은 전체 메인 에디터와 하단의 간결한 플로팅 프롬프트 바(토글형 Chat)로 군더더기 없이 심플하게 구성되어 있습니다."
      },
      {
        category: "워크스페이스 연동",
        question: "캔버스에서 작성한 문서를 내 구글 드라이브(Google Docs)로 바로 저장하고 싶을 때 올바른 경로는?",
        options: [
          "상단 우측 [공유 및 내보내기] 메뉴 ➔ [Docs로 내보내기] 클릭",
          "하단 프롬프트에 '드라이브 파일 다운로드' 명령어 직접 코딩",
          "좌측 하단 히스토리 메뉴에서 저장 버튼 찾기",
          "브라우저의 인쇄 메뉴를 열어 PDF로 변환 후 드라이브에 수동 업로드"
        ],
        answer: 0,
        explanation: "우측 상단에 위치한 [공유 및 내보내기(Share & Export)] 버튼을 누르면 나타나는 드롭다운 메뉴에서 [Docs로 내보내기]를 클릭하면 즉시 연동됩니다."
      },
      {
        category: "실시간 프리뷰 (Live Preview)",
        question: "일반 텍스트를 작성 중일 때 [Code | Preview] 탭이 보이지 않는 이유는 무엇일까요?",
        options: [
          "유료 플랜을 구독하지 않으면 프리뷰 기능이 비활성화되기 때문",
          "상단 설정 메뉴에서 개발자 모드를 켜지 않았기 때문",
          "코드가 생성되지 않은 일반 문서 모드이며, 웹/퀴즈 변환을 요청해야 코드 모드로 전환되기 때문",
          "구글 크롬 브라우저가 아닌 다른 브라우저를 쓰고 있기 때문"
        ],
        answer: 2,
        explanation: "프리뷰 탭은 항상 고정 노출되는 것이 아니라, 하단 대화창을 통해 웹페이지나 인터랙티브 앱(HTML/JS) 생성을 요청하여 코드 모드로 전환되었을 때 상단에 활성화됩니다."
      },
      {
        category: "인라인 편집 팝업",
        question: "캔버스 본문에서 특정 문장이나 문단을 마우스로 드래그했을 때 나타나는 팝업 도구의 기능은?",
        options: [
          "자동으로 컴퓨터 음성 녹음을 시작하는 보이스 레코더",
          "드래그한 부분만 콕 집어 지시하는 [제미나이에게 물어보기]와 메모 피드백을 주는 [수정 제안]",
          "글꼴 크기와 폰트 색상을 변경하는 워드 프로세서 서식 바",
          "문서 전체를 즉시 삭제하고 초기화하는 휴지통 도구"
        ],
        answer: 1,
        explanation: "마우스로 드래그하면 화면에 플로팅 팝업이 나타나 해당 문장만 특정 어투로 교정하거나, 제3자 검토자처럼 메모 형태의 피드백을 남기는 [수정 제안] 기능을 사용할 수 있습니다."
      },
      {
        category: "실전 블로그 루틴",
        question: "블로그 작업 시간을 획기적으로 줄여주는 실전 3단계 워크플로우로 본문에서 추천한 순서는?",
        options: [
          "글자 수 카운트 ➔ 이미지 수집 ➔ 타사 번역기로 문체 교정",
          "HTML 코드 작성 ➔ 구글 슬라이드 변환 ➔ 팟캐스트 오디오 녹음",
          "메인 캔버스 뼈대 초안 ➔ @내-블로그-문체 스킬 일괄 적용 ➔ 맞춤법 교정 및 글자 수 확인 후 Docs 내보내기",
          "외부 맞춤법 검사기 복사 ➔ 수동 오탈자 교정 ➔ 메모장에 저장"
        ],
        answer: 2,
        explanation: "정보성 뼈대 초안을 먼저 생성한 뒤 사전 등록한 문체 스킬(@스킬)로 톤앤매너를 일괄 바꾸고, 맞춤법/글자 수 검수를 한 번에 끝내는 것이 가장 효율적인 실전 루틴입니다."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // DOM 요소
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const progressIndicator = document.getElementById("progress-indicator");
    const progressBar = document.getElementById("progress-bar");
    const badge = document.getElementById("badge");
    const feedbackBox = document.getElementById("feedback-box");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackDesc = document.getElementById("feedback-desc");
    const nextBtn = document.getElementById("next-btn");
    const quizCard = document.getElementById("quiz-card");
    const resultCard = document.getElementById("result-card");
    const finalScore = document.getElementById("final-score");
    const scorePercent = document.getElementById("score-percent");
    const resultMessage = document.getElementById("result-message");
    const retryBtn = document.getElementById("retry-btn");

    function loadQuestion() {
      answered = false;
      feedbackBox.classList.add("hidden");
      nextBtn.classList.add("hidden");

      const current = quizData[currentQuestionIndex];
      questionText.textContent = `${currentQuestionIndex + 1}. ${current.question}`;
      badge.textContent = current.category;
      progressIndicator.textContent = `문제 ${currentQuestionIndex + 1} / ${quizData.length}`;
      progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

      optionsContainer.innerHTML = "";

      current.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50/40 transition duration-150 flex items-start gap-3 group";
        btn.innerHTML = `
          <span class="w-6 h-6 rounded-full border border-slate-300 text-xs font-semibold flex items-center justify-center shrink-0 mt-0.5 group-hover:border-blue-500 group-hover:text-blue-600 bg-slate-50 text-slate-600">
            ${idx + 1}
          </span>
          <span class="text-sm md:text-base font-medium text-slate-700 group-hover:text-slate-900 leading-snug">
            ${opt}
          </span>
        `;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      if (answered) return;
      answered = true;

      const current = quizData[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll("button");

      buttons.forEach((b) => {
        b.classList.remove("hover:border-blue-400", "hover:bg-blue-50/40");
        b.disabled = true;
      });

      if (selectedIndex === current.answer) {
        score++;
        selectedBtn.classList.remove("border-slate-200", "bg-white");
        selectedBtn.classList.add("border-emerald-500", "bg-emerald-50", "text-emerald-900");
        selectedBtn.querySelector("span").classList.add("border-emerald-500", "bg-emerald-500", "text-white");

        feedbackBox.className = "rounded-xl p-4 mb-6 border bg-emerald-50 border-emerald-200 text-emerald-900 block";
        feedbackIcon.className = "fa-solid fa-circle-check text-emerald-600 text-lg mt-0.5";
        feedbackTitle.textContent = "정답입니다! 👏";
      } else {
        selectedBtn.classList.remove("border-slate-200", "bg-white");
        selectedBtn.classList.add("border-rose-400", "bg-rose-50", "text-rose-900");
        selectedBtn.querySelector("span").classList.add("border-rose-400", "bg-rose-500", "text-white");

        const correctBtn = buttons[current.answer];
        correctBtn.classList.remove("border-slate-200", "bg-white");
        correctBtn.classList.add("border-emerald-500", "bg-emerald-50");

        feedbackBox.className = "rounded-xl p-4 mb-6 border bg-rose-50 border-rose-200 text-rose-900 block";
        feedbackIcon.className = "fa-solid fa-circle-xmark text-rose-600 text-lg mt-0.5";
        feedbackTitle.textContent = "아쉽네요, 오답입니다.";
      }

      feedbackDesc.textContent = current.explanation;
      nextBtn.classList.remove("hidden");
    }

    nextBtn.onclick = () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizCard.classList.add("hidden");
      resultCard.classList.remove("hidden");

      finalScore.textContent = `${score} / ${quizData.length}`;
      const pct = Math.round((score / quizData.length) * 100);
      scorePercent.textContent = `정답률 ${pct}%`;

      if (score === quizData.length) {
        resultMessage.textContent = "완벽합니다! 제미나이 캔버스를 200% 활용하실 준비가 되었습니다 🎉";
      } else if (score >= 3) {
        resultMessage.textContent = "훌륭합니다! 캔버스의 주요 특징과 워크플로우를 잘 이해하고 계십니다 👍";
      } else {
        resultMessage.textContent = "가이드 글을 한 번 더 가볍게 읽어보시면 더욱 능숙하게 다루실 수 있습니다 😊";
      }
    }

    retryBtn.onclick = () => {
      currentQuestionIndex = 0;
      score = 0;
      resultCard.classList.add("hidden");
      quizCard.classList.remove("hidden");
      loadQuestion();
    };

    // 초기화
    loadQuestion();
  </script>
</body>
</html>
